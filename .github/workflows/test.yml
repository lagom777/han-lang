# 검사 — push(main)와 PR 마다. 러너는 root 가 아니라서 보안회귀의 chmod 000 항목도 실제로 돈다.
name: 검사

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30         # 무한 반복으로 퇴행하면 기본 6시간을 다 쓴다
    steps:
      - uses: actions/checkout@v5
      - name: clang (네이티브 길 검사에 필요)
        run: command -v clang || { sudo apt-get update && sudo apt-get install -y clang; }
      - name: ganada-c — 골든 · 보안회귀 · 네이티브회귀
        run: make -C ganada-c && make -C ganada-c test
      - name: ganada-os — 검사 · 다시묶기(자기 소스를 같은 바이트로 다시 묶는다)
        run: |
          make -C ganada-os 검사
          make -C ganada-os 다시묶기
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: 파이썬 참조 구현 · C 와 교차검증
        run: |
          python3 tests/test_han.py
          make -C ganada-c test-conform

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: ganada-c — 골든 · 보안회귀 · 네이티브회귀
        run: make -C ganada-c && make -C ganada-c test
